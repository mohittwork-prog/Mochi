name: Build Mochi .dmg
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['docs/**']
permissions:
  contents: write
jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Build the .dmg installers
        env:
          # Optional: add these repository secrets to sign with an Apple Developer ID and notarise,
          # so the app opens with no warning at all. Without them the app is ad-hoc signed.
          CSC_LINK: ${{ secrets.MAC_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$CSC_LINK" ]; then EXTRA="-c.mac.notarize=true"; else unset CSC_LINK CSC_KEY_PASSWORD; EXTRA=""; fi
          npx electron-builder --mac dmg --arm64 --publish never $EXTRA
          npx electron-builder --mac dmg --x64 --publish never $EXTRA
      - name: Check the app signature
        run: |
          for app in dist/mac*/Mochi.app; do codesign --verify --deep --strict --verbose=2 "$app"; done
      - uses: actions/upload-artifact@v4
        with:
          name: Mochi-dmg
          path: dist/*.dmg
      - name: Read the version
        id: ver
        run: echo "v=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Publish the release (download links on the website point here)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.v }}
          name: Mochi ${{ steps.ver.outputs.v }}
          make_latest: true
          files: dist/*.dmg
          body: |
            Download **Mochi-arm64.dmg** for Apple Silicon Macs (M1 and later) or **Mochi-x64.dmg** for Intel Macs.
            First launch: right-click Mochi → Open, then allow it in System Settings → Privacy & Security → Accessibility.
