name: Build Mochi .dmg
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['docs/**']
permissions:
  contents: write
jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: Mochi-dmg
          path: dist/*.dmg
      - name: Publish a release for version tags
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Mochi ${{ github.ref_name }}
          files: dist/*.dmg
          body: |
            Download **Mochi-arm64.dmg** for Apple Silicon Macs (M1 and later) or **Mochi-x64.dmg** for Intel Macs.
            First launch: right-click Mochi → Open, then allow it in System Settings → Privacy & Security → Accessibility.
