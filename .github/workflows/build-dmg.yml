name: Build Mochi .dmg
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['docs/**']
permissions:
  contents: write
jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: Mochi-dmg
          path: dist/*.dmg
      - name: Read the version
        id: ver
        run: echo "v=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Publish the release (download links on the website point here)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.v }}
          name: Mochi ${{ steps.ver.outputs.v }}
          make_latest: true
          files: dist/*.dmg
          body: |
            Download **Mochi-arm64.dmg** for Apple Silicon Macs (M1 and later) or **Mochi-x64.dmg** for Intel Macs.
            First launch: right-click Mochi → Open, then allow it in System Settings → Privacy & Security → Accessibility.
